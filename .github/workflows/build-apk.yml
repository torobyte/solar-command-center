name: Build Android APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.3). Leave blank for auto timestamp tag.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npx / Capacitor CLI downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'bun.lockb', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: |
          npm install --no-save \
            @capacitor/core@^6 \
            @capacitor/cli@^6 \
            @capacitor/android@^6

      - name: Bootstrap Android project (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not committed — generating with Capacitor"
            mkdir -p dist
            echo "<!doctype html><title>SolarOps</title>" > dist/index.html
            npx cap add android
          else
            echo "android/ already present"
          fi
          npx cap sync android

      - name: Apply platform branding (icon, name, colors)
        run: |
          set -e
          BRAND_URL="https://appsolar.torobyte.com/api/public/manifest"
          echo "Fetching branding from $BRAND_URL"
          curl -fsSL "$BRAND_URL" -o /tmp/manifest.json || { echo "::warning::Could not fetch branding, using defaults"; exit 0; }
          cat /tmp/manifest.json

          APP_NAME=$(python3 -c "import json;d=json.load(open('/tmp/manifest.json'));print(d.get('name','SolarOps'))")
          SHORT_NAME=$(python3 -c "import json;d=json.load(open('/tmp/manifest.json'));print(d.get('short_name', d.get('name','SolarOps')))")
          THEME=$(python3 -c "import json;d=json.load(open('/tmp/manifest.json'));print(d.get('theme_color','#f59e0b'))")
          BG=$(python3 -c "import json;d=json.load(open('/tmp/manifest.json'));print(d.get('background_color','#0a0a0a'))")
          ICON_512=$(python3 -c "import json;d=json.load(open('/tmp/manifest.json'));icons=d.get('icons',[]);best=next((i['src'] for i in icons if '512' in str(i.get('sizes',''))),'');print(best or (icons[0]['src'] if icons else ''))")
          ICON_192=$(python3 -c "import json;d=json.load(open('/tmp/manifest.json'));icons=d.get('icons',[]);best=next((i['src'] for i in icons if '192' in str(i.get('sizes',''))),'');print(best or '')")

          echo "App=$APP_NAME / Short=$SHORT_NAME / Theme=$THEME / BG=$BG"
          echo "Icon512=$ICON_512"

          # Download icon (prefer 512, fallback to 192). Only PNGs become launcher icons.
          ICON_SRC=""
          if [ -n "$ICON_512" ] && [[ "$ICON_512" == *.png ]]; then ICON_SRC="$ICON_512"; fi
          if [ -z "$ICON_SRC" ] && [ -n "$ICON_192" ] && [[ "$ICON_192" == *.png ]]; then ICON_SRC="$ICON_192"; fi

          if [ -n "$ICON_SRC" ]; then
            echo "Downloading launcher icon from $ICON_SRC"
            curl -fsSL "$ICON_SRC" -o /tmp/icon-src.png
            sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            RES="android/app/src/main/res"
            declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
            for D in "${!SIZES[@]}"; do
              S=${SIZES[$D]}
              mkdir -p "$RES/mipmap-$D"
              convert /tmp/icon-src.png -resize ${S}x${S} "$RES/mipmap-$D/ic_launcher.png"
              # Round icon: just reuse the square; Android masks it at runtime.
              cp "$RES/mipmap-$D/ic_launcher.png" "$RES/mipmap-$D/ic_launcher_round.png"
              # Foreground for adaptive icon (anydpi-v26 references this).
              convert /tmp/icon-src.png -resize ${S}x${S} "$RES/mipmap-$D/ic_launcher_foreground.png"
            done
            # Drop any leftover vector adaptive-icon that points to a missing foreground drawable.
            rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          else
            echo "::warning::No PNG icon available in branding; keeping Capacitor default."
          fi

          # App name in strings.xml — overwrite both app_name and title_activity_main.
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            APP_NAME="$APP_NAME" STRINGS_PATH="$STRINGS" python3 -c 'import os, re; p=os.environ["STRINGS_PATH"]; name=os.environ["APP_NAME"].replace("&","&amp;").replace("<","&lt;"); s=open(p).read(); s=re.sub(r"(<string name=\"app_name\">)[^<]*(</string>)", r"\g<1>"+name+r"\g<2>", s); s=re.sub(r"(<string name=\"title_activity_main\">)[^<]*(</string>)", r"\g<1>"+name+r"\g<2>", s); open(p,"w").write(s); print(s)'
          fi

          # Background color used by Capacitor splash / window background.
          COLORS="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS" ]; then
            BG="$BG" THEME="$THEME" COLORS_PATH="$COLORS" python3 -c 'import os, re; p=os.environ["COLORS_PATH"]; bg=os.environ["BG"]; theme=os.environ["THEME"]; s=open(p).read(); s=re.sub(r"(<color name=\"colorPrimary\">)[^<]*(</color>)", r"\g<1>"+theme+r"\g<2>", s); s=re.sub(r"(<color name=\"colorPrimaryDark\">)[^<]*(</color>)", r"\g<1>"+theme+r"\g<2>", s); s=re.sub(r"(<color name=\"colorAccent\">)[^<]*(</color>)", r"\g<1>"+theme+r"\g<2>", s); s=re.sub(r"(<color name=\"ic_launcher_background\">)[^<]*(</color>)", r"\g<1>"+bg+r"\g<2>", s); open(p,"w").write(s); print(s)'
          fi

      - name: Merge widget overrides
        run: |
          PKG_DIR="android/app/src/main/java/app/solarops/client"
          RES="android/app/src/main/res"
          mkdir -p "$PKG_DIR" "$RES/layout" "$RES/drawable" "$RES/xml" "$RES/values"
          # Copy widget sources, but keep Capacitor's generated MainActivity
          for SRC in android-widget/java/*.kt; do
            BASENAME=$(basename "$SRC")
            if [ "$BASENAME" = "MainActivity.kt" ]; then
              echo "Skipping $BASENAME to avoid duplicate launcher activity"
              continue
            fi
            cp -f "$SRC" "$PKG_DIR/"
          done
          cp -rf android-widget/res/* "$RES/" 2>/dev/null || true

      - name: Merge AndroidManifest snippet
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          SNIPPET="android-widget/AndroidManifest.snippet.xml"
          if ! grep -q "SolarOpsWidget" "$MANIFEST"; then
            # Ensure INTERNET permission
            grep -q "android.permission.INTERNET" "$MANIFEST" || \
              sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
            # Inject widget declarations before </application>, excluding duplicate MainActivity
            SNIPPET_CONTENT=$(cat "$SNIPPET")
            awk -v snip="$SNIPPET_CONTENT" '/<\/application>/{print snip} {print}' "$MANIFEST" > "${MANIFEST}.new"
            mv "${MANIFEST}.new" "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
            android/app/build/intermediates
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.android/cache
          key: android-sdk-${{ runner.os }}-v1

      - name: Grant gradlew permissions
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK (always — uses release keystore if provided, else auto-generated)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            K_PASS="$KEY_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — generating a temporary keystore. APK will install, but you cannot upgrade it from a previous signed install without uninstalling first."
            KS_PASS="solarops"
            K_PASS="solarops"
            K_ALIAS="solarops"
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SolarOps, OU=Dev, O=SolarOps, L=NA, S=NA, C=US"
          fi
          APK_IN=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n1)
          if [ -z "$APK_IN" ]; then
            APK_IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          fi
          APK_OUT=android/app/build/outputs/apk/release/app-release-signed.apk
          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$APK_IN" /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$K_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_OUT" \
            /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK_OUT"
          echo "apk_path=$APK_OUT" >> $GITHUB_OUTPUT

      - name: Locate APK
        id: locate
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release-signed.apk" ]; then
            echo "apk=android/app/build/outputs/apk/release/app-release-signed.apk" >> $GITHUB_OUTPUT
          else
            APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
            echo "apk=$APK" >> $GITHUB_OUTPUT
          fi

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=apk-$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksum
        id: sha
        run: |
          APK="${{ steps.locate.outputs.apk }}"
          sha256sum "$APK" | awk '{print $1}' > "${APK}.sha256"
          echo "sha=$(cat ${APK}.sha256)" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: APK ${{ steps.tag.outputs.tag }}
          body: |
            APK firmado generado automáticamente.
            SHA-256: `${{ steps.sha.outputs.sha }}`
          files: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256
          generate_release_notes: false
