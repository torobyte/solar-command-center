name: Build Android APK

on:
  # Cualquier push a main publica un nuevo APK (no solo cambios en android/)
  push:
    branches: [main]
  # Build programado: todos los días a las 04:00 UTC
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.3). Leave blank for auto timestamp tag.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Grant gradlew permissions
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        id: sign
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APK_IN=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n1)
          APK_OUT=android/app/build/outputs/apk/release/app-release-signed.apk
          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$APK_IN" /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_OUT" \
            /tmp/aligned.apk
          echo "apk_path=$APK_OUT" >> $GITHUB_OUTPUT

      - name: Locate APK
        id: locate
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release-signed.apk" ]; then
            echo "apk=android/app/build/outputs/apk/release/app-release-signed.apk" >> $GITHUB_OUTPUT
          else
            APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
            echo "apk=$APK" >> $GITHUB_OUTPUT
          fi

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=apk-$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksum
        id: sha
        run: |
          APK="${{ steps.locate.outputs.apk }}"
          sha256sum "$APK" | awk '{print $1}' > "${APK}.sha256"
          echo "sha=$(cat ${APK}.sha256)" >> $GITHUB_OUTPUT

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: APK ${{ steps.tag.outputs.tag }}
          body: |
            APK firmado generado automáticamente.
            SHA-256: `${{ steps.sha.outputs.sha }}`
          files: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256
          generate_release_notes: false
