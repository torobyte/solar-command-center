name: Build Android APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.3). Leave blank for auto timestamp tag.'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous in-progress runs of this workflow
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          all_but_latest: true

      - name: Checkout (full clean)
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Wipe workspace caches and stale build outputs
        run: |
          set -e
          echo "Cleaning any leftover build outputs / caches before building"
          rm -rf android/app/build android/build android/.gradle dist node_modules ~/.gradle/caches ~/.gradle/wrapper ~/.android/build-cache ~/.android/cache /tmp/aligned.apk /tmp/release.keystore || true

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: |
          npm install --no-save \
            @capacitor/core@^6 \
            @capacitor/cli@^6 \
            @capacitor/android@^6

      - name: Fetch APK config (brand, icon, start URL)
        id: brand
        run: |
          set -e
          BRAND_URLS="https://appsolar.torobyte.com/api/public/apk-brand https://project--7cb3041b-eb20-43aa-ba17-b0848cb53051-dev.lovable.app/api/public/apk-brand https://appsolar.torobyte.com/api/public/manifest"
          rm -f /tmp/brand.json
          for BRAND_URL in $BRAND_URLS; do
            echo "Fetching APK config from $BRAND_URL"
            if curl -fsSL "$BRAND_URL" -o /tmp/brand.json; then
              echo "Using branding from $BRAND_URL"
              break
            fi
          done
          if [ ! -f /tmp/brand.json ]; then
            echo "::warning::Could not fetch apk-brand, using defaults"
            echo '{}' > /tmp/brand.json
          fi
          cat /tmp/brand.json

          APP_NAME=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));print(d.get('app_name') or d.get('name') or 'SolarOps')")
          APP_ID=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));print(d.get('app_id') or 'app.solarops.client')")
          SERVER_URL=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));print((d.get('server_url') or 'https://appsolar.torobyte.com').rstrip('/'))")
          START_PATH=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));p=d.get('start_path') or '/api/public/apk-bootstrap';print(p if p.startswith('/') else '/'+p)")
          THEME=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));print(d.get('primary_color') or d.get('theme_color') or '#f59e0b')")
          BG=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));print(d.get('background_color') or '#0a0a0a')")
          ICON_URL=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));icons=d.get('icons') or [];print(d.get('icon_url') or (icons[-1].get('src') if icons else ''))")
          CLEARTEXT=$(python3 -c "import json;d=json.load(open('/tmp/brand.json'));print('true' if d.get('cleartext') else 'false')")

          FULL_URL="${SERVER_URL}${START_PATH}"
          echo "App=$APP_NAME / Id=$APP_ID / Url=$FULL_URL / Icon=$ICON_URL"

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "full_url=$FULL_URL" >> $GITHUB_OUTPUT
          echo "theme=$THEME" >> $GITHUB_OUTPUT
          echo "bg=$BG" >> $GITHUB_OUTPUT
          echo "icon_url=$ICON_URL" >> $GITHUB_OUTPUT
          echo "cleartext=$CLEARTEXT" >> $GITHUB_OUTPUT

      - name: Patch capacitor.config.ts with admin settings
        env:
          APP_ID: ${{ steps.brand.outputs.app_id }}
          APP_NAME: ${{ steps.brand.outputs.app_name }}
          FULL_URL: ${{ steps.brand.outputs.full_url }}
          BG: ${{ steps.brand.outputs.bg }}
          CLEARTEXT: ${{ steps.brand.outputs.cleartext }}
        run: |
          python3 -c '
          import os
          cfg = f"""import type {{ CapacitorConfig }} from "@capacitor/cli";
          const config: CapacitorConfig = {{
            appId: {os.environ["APP_ID"]!r},
            appName: {os.environ["APP_NAME"]!r},
            webDir: "dist",
            server: {{
              url: {os.environ["FULL_URL"]!r},
              cleartext: {os.environ["CLEARTEXT"]},
              androidScheme: "https",
            }},
            android: {{
              backgroundColor: {os.environ["BG"]!r},
            }},
          }};
          export default config;
          """
          open("capacitor.config.ts","w").write(cfg)
          print(cfg)
          '

      - name: Bootstrap Android project (if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not committed — generating with Capacitor"
            mkdir -p dist
            echo "<!doctype html><title>${{ steps.brand.outputs.app_name }}</title>" > dist/index.html
            npx cap add android
          else
            echo "android/ already present"
          fi
          npx cap sync android

      - name: Enable Kotlin compilation for native widget sources
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          top = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          if not top.exists() or not app.exists():
              raise SystemExit("Gradle files not found after cap sync")

          top_src = top.read_text()
          if "kotlin-gradle-plugin" not in top_src:
              if "dependencies {" not in top_src:
                  raise SystemExit("Could not locate top-level Gradle dependencies block")
              top_src = top_src.replace(
                  "dependencies {",
                  "dependencies {\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24\"",
                  1,
              )
          top.write_text(top_src)

          app_src = app.read_text()
          if "kotlin-android" not in app_src and "org.jetbrains.kotlin.android" not in app_src:
              if "apply plugin: 'com.android.application'" in app_src:
                  app_src = app_src.replace(
                      "apply plugin: 'com.android.application'",
                      "apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'",
                      1,
                  )
              elif "android {" in app_src:
                  app_src = app_src.replace(
                      "android {",
                      "apply plugin: 'kotlin-android'\n\nandroid {",
                      1,
                  )
              else:
                  raise SystemExit("Could not inject Kotlin Android plugin into app/build.gradle")

          if "kotlin-stdlib" not in app_src and "org.jetbrains.kotlin:kotlin-stdlib" not in app_src:
              app_src = re.sub(
                  r"(dependencies\s*\{)",
                  r'\1\n    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"',
                  app_src,
                  count=1,
              )
          if "androidx.core:core-ktx" not in app_src and "androidx.core:core:" not in app_src:
              app_src = re.sub(
                  r"(dependencies\s*\{)",
                  r'\1\n    implementation "androidx.core:core-ktx:1.13.1"',
                  app_src,
                  count=1,
              )
          app.write_text(app_src)

          proguard = Path("android/app/proguard-rules.pro")
          existing = proguard.read_text() if proguard.exists() else ""
          rules = """
          -keep class app.solarops.client.MainActivity { *; }
          -keep class app.solarops.client.WidgetSetupActivity { *; }
          -keep class app.solarops.client.WidgetConfigActivity { *; }
          -keep class app.solarops.client.SolarOpsWidget { *; }
          -keep class app.solarops.client.SolarOpsWidgetTiles { *; }
          -keep class app.solarops.client.SolarOpsWidgetGauge { *; }
          -keep class app.solarops.client.SolarOpsWidgetNeon { *; }
          -keep class app.solarops.client.SolarOpsWidgetFlow { *; }
          -keep class app.solarops.client.SolarOpsWidgetMini { *; }
          -keep class app.solarops.client.SolarOpsWidgetSpeedo { *; }
          -keep class app.solarops.client.SolarOpsWidgetWave { *; }
          -keep class app.solarops.client.SolarOpsWidgetStats { *; }
          -keep class app.solarops.client.SolarOpsWidgetRadial { *; }
          -keep class app.solarops.client.WidgetStreamService { *; }
          -keep class app.solarops.client.LockscreenLiveService { *; }
          -keep class app.solarops.client.WaveAnimator { *; }
          -keep class app.solarops.client.UpdateManager { *; }
          -keep class app.solarops.client.BrandSync { *; }
          -keep class app.solarops.client.BrandSync$Brand { *; }
          """.strip()
          if rules not in existing:
              proguard.write_text((existing.rstrip() + "\n\n" + rules + "\n").lstrip())
          PY

      - name: Apply launcher icon, name and colors to Android resources
        env:
          APP_NAME: ${{ steps.brand.outputs.app_name }}
          THEME: ${{ steps.brand.outputs.theme }}
          BG: ${{ steps.brand.outputs.bg }}
          ICON_URL: ${{ steps.brand.outputs.icon_url }}
        run: |
          set -e
          ICON_SRC="$ICON_URL"

          if [ -n "$ICON_SRC" ]; then
            echo "Downloading launcher icon from $ICON_SRC"
            curl -fsSL "$ICON_SRC" -o /tmp/icon-src.png
            sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            RES="android/app/src/main/res"
            declare -A SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
            for D in "${!SIZES[@]}"; do
              S=${SIZES[$D]}
              mkdir -p "$RES/mipmap-$D"
              convert /tmp/icon-src.png -background none -gravity center -resize ${S}x${S} -extent ${S}x${S} "$RES/mipmap-$D/ic_launcher.png"
              # Round icon: just reuse the square; Android masks it at runtime.
              cp "$RES/mipmap-$D/ic_launcher.png" "$RES/mipmap-$D/ic_launcher_round.png"
              # Foreground for adaptive icon (anydpi-v26 references this).
              convert /tmp/icon-src.png -background none -gravity center -resize ${S}x${S} -extent ${S}x${S} "$RES/mipmap-$D/ic_launcher_foreground.png"
            done
            mkdir -p "$RES/mipmap-anydpi-v26"
            cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<EOF
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
            cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          else
            echo "::warning::No PNG icon available in branding; keeping Capacitor default."
          fi

          # App name in strings.xml — overwrite both app_name and title_activity_main.
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            APP_NAME="$APP_NAME" STRINGS_PATH="$STRINGS" python3 -c 'import os, re; p=os.environ["STRINGS_PATH"]; name=os.environ["APP_NAME"].replace("&","&amp;").replace("<","&lt;"); s=open(p).read(); s=re.sub(r"(<string name=\"app_name\">)[^<]*(</string>)", r"\g<1>"+name+r"\g<2>", s); s=re.sub(r"(<string name=\"title_activity_main\">)[^<]*(</string>)", r"\g<1>"+name+r"\g<2>", s); open(p,"w").write(s); print(s)'
          fi

          # Background color used by Capacitor splash / window background.
          COLORS="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS" ]; then
            BG="$BG" THEME="$THEME" COLORS_PATH="$COLORS" python3 -c 'import os, re; p=os.environ["COLORS_PATH"]; bg=os.environ["BG"]; theme=os.environ["THEME"]; s=open(p).read(); s=re.sub(r"(<color name=\"colorPrimary\">)[^<]*(</color>)", r"\g<1>"+theme+r"\g<2>", s); s=re.sub(r"(<color name=\"colorPrimaryDark\">)[^<]*(</color>)", r"\g<1>"+theme+r"\g<2>", s); s=re.sub(r"(<color name=\"colorAccent\">)[^<]*(</color>)", r"\g<1>"+theme+r"\g<2>", s); s=re.sub(r"(<color name=\"ic_launcher_background\">)[^<]*(</color>)", r"\g<1>"+bg+r"\g<2>", s); open(p,"w").write(s); print(s)'
          fi

      - name: Merge widget overrides
        run: |
          PKG_DIR="android/app/src/main/kotlin/app/solarops/client"
          RES="android/app/src/main/res"
          mkdir -p "$PKG_DIR" "$RES/layout" "$RES/drawable" "$RES/xml" "$RES/values"
          rm -f android/app/src/main/java/app/solarops/client/MainActivity.java
          rm -f android/app/src/main/java/app/solarops/client/MainActivity.kt
          rm -f android/app/src/main/kotlin/app/solarops/client/MainActivity.java
          # Copy widget sources, including the custom launcher activity.
          for SRC in android-widget/java/*.kt; do
            cp -f "$SRC" "$PKG_DIR/"
          done
          cp -rf android-widget/res/* "$RES/" 2>/dev/null || true

      - name: Merge AndroidManifest snippet (idempotent — strips & re-injects)
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          SNIPPET="android-widget/AndroidManifest.snippet.xml"
          # Ensure required permissions
          grep -q "android.permission.INTERNET" "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE\"" "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <application|' "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE_DATA_SYNC" "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <application|' "$MANIFEST"
          grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' "$MANIFEST"
          # Strip any previously-injected SolarOps widget block (between markers or matching the old short-form classes)
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          # Remove any <activity>/<receiver> referencing SolarOpsWidget*, WidgetSetupActivity or WidgetConfigActivity (short or fully-qualified)
          patterns = [
              r'<activity[^>]*android:name="(?:\.|app\.solarops\.client\.)WidgetSetupActivity"[^>]*(?:/>|>[\s\S]*?</activity>)',
              r'<activity[^>]*android:name="(?:\.|app\.solarops\.client\.)WidgetConfigActivity"[^>]*(?:/>|>[\s\S]*?</activity>)',
              r'<receiver[^>]*android:name="(?:\.|app\.solarops\.client\.)SolarOpsWidget(?:Tiles|Gauge|Neon|Flow|Mini|Speedo|Wave|Stats|Radial)?"[^>]*(?:/>|>[\s\S]*?</receiver>)',
              r'<service[^>]*android:name="(?:\.|app\.solarops\.client\.)WidgetStreamService"[^>]*(?:/>|>[\s\S]*?</service>)',
              r'<service[^>]*android:name="(?:\.|app\.solarops\.client\.)LockscreenLiveService"[^>]*(?:/>|>[\s\S]*?</service>)',
          ]
          for pat in patterns:
              s = re.sub(pat, '', s)
          open(p, 'w').write(s)
          PY
          # Re-inject the fresh snippet before </application>
          SNIPPET_CONTENT=$(cat "$SNIPPET")
          awk -v snip="$SNIPPET_CONTENT" '/<\/application>/{print snip} {print}' "$MANIFEST" > "${MANIFEST}.new"
          mv "${MANIFEST}.new" "$MANIFEST"
          echo "===== Final AndroidManifest.xml ====="
          cat "$MANIFEST"

      - name: Force fresh versionCode / versionName (timestamp-based)
        id: ver
        run: |
          set -e
          GRADLE="android/app/build.gradle"
          VCODE=$(date -u +%s)
          VNAME="1.0.$(date -u +%Y%m%d%H%M)"
          echo "Patching $GRADLE -> versionCode=$VCODE versionName=$VNAME"
          python3 - <<PY
          import re, os
          p = "$GRADLE"
          s = open(p).read()
          s = re.sub(r'versionCode\s+\d+', 'versionCode $VCODE', s)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "$VNAME"', s)
          open(p,"w").write(s)
          PY
          grep -E "versionCode|versionName" "$GRADLE" || true
          echo "vcode=$VCODE" >> $GITHUB_OUTPUT
          echo "vname=$VNAME" >> $GITHUB_OUTPUT

      # NOTE: Gradle / Android SDK caches intentionally NOT used.
      # We want every run to produce a fully fresh APK so the user never
      # downloads a stale artifact assembled from a previous workflow.

      - name: Grant gradlew permissions
        working-directory: android
        run: chmod +x ./gradlew

      - name: Clean Android build outputs
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify widget classes are present in built APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::No APK found after assembleRelease"
            exit 1
          fi
          for CLASS in \
            'Lapp/solarops/client/MainActivity;' \
            'Lapp/solarops/client/WidgetSetupActivity;' \
            'Lapp/solarops/client/WidgetConfigActivity;' \
            'Lapp/solarops/client/SolarOpsWidget;' \
            'Lapp/solarops/client/SolarOpsWidgetTiles;' \
            'Lapp/solarops/client/SolarOpsWidgetGauge;' \
            'Lapp/solarops/client/SolarOpsWidgetNeon;' \
            'Lapp/solarops/client/SolarOpsWidgetFlow;' \
            'Lapp/solarops/client/SolarOpsWidgetMini;' \
            'Lapp/solarops/client/SolarOpsWidgetSpeedo;' \
            'Lapp/solarops/client/SolarOpsWidgetWave;' \
            'Lapp/solarops/client/SolarOpsWidgetStats;' \
            'Lapp/solarops/client/SolarOpsWidgetRadial;' \
            'Lapp/solarops/client/UpdateManager;' \
            'Lapp/solarops/client/BrandSync;' \
            'Lapp/solarops/client/WidgetStreamService;' \
            'Lapp/solarops/client/LockscreenLiveService;'
          do
            if ! unzip -p "$APK" classes.dex | strings | grep -F "$CLASS" >/dev/null; then
              echo "::error::Missing class in APK: $CLASS"
              exit 1
            fi
          done
          echo "Widget classes verified inside APK"

      - name: Sign APK (always — uses release keystore if provided, else auto-generated)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            KS_PASS="$KEYSTORE_PASSWORD"
            K_PASS="$KEY_PASSWORD"
            K_ALIAS="$KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — generating a temporary keystore. APK will install, but you cannot upgrade it from a previous signed install without uninstalling first."
            KS_PASS="solarops"
            K_PASS="solarops"
            K_ALIAS="solarops"
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SolarOps, OU=Dev, O=SolarOps, L=NA, S=NA, C=US"
          fi
          APK_IN=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -n1)
          if [ -z "$APK_IN" ]; then
            APK_IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          fi
          APK_OUT=android/app/build/outputs/apk/release/app-release-signed.apk
          BUILD_TOOLS=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n1)
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$APK_IN" /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass pass:"$KS_PASS" \
            --key-pass pass:"$K_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_OUT" \
            /tmp/aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --verbose "$APK_OUT"
          echo "apk_path=$APK_OUT" >> $GITHUB_OUTPUT

      - name: Locate APK
        id: locate
        run: |
          if [ -f "android/app/build/outputs/apk/release/app-release-signed.apk" ]; then
            echo "apk=android/app/build/outputs/apk/release/app-release-signed.apk" >> $GITHUB_OUTPUT
          else
            APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
            echo "apk=$APK" >> $GITHUB_OUTPUT
          fi

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=apk-$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksum
        id: sha
        run: |
          APK="${{ steps.locate.outputs.apk }}"
          sha256sum "$APK" | awk '{print $1}' > "${APK}.sha256"
          echo "sha=$(cat ${APK}.sha256)" >> $GITHUB_OUTPUT

      - name: Delete previous workflow artifacts (keep only this run)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const wf = context.workflow;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: run.id, per_page: 100,
              });
              for (const a of arts) {
                if (a.name === 'app-release') {
                  console.log(`Deleting artifact ${a.id} from run ${run.id}`);
                  try { await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id }); } catch (e) { console.log(e.message); }
                }
              }
            }

      - name: Upload APK as workflow artifact (overwrite previous)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          overwrite: true
          retention-days: 7
          path: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256

      - name: Delete old APK releases (keep last 3 + this one)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const apkReleases = releases.filter(r => r.tag_name && (r.tag_name.startsWith('apk-') || r.tag_name === 'latest'));
            // Keep `latest` (handled below) + the 3 most recent timestamped ones
            const timestamped = apkReleases
              .filter(r => r.tag_name.startsWith('apk-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = timestamped.slice(3);
            for (const r of toDelete) {
              console.log(`Deleting release ${r.tag_name} (id=${r.id})`);
              try { await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id }); } catch (e) { console.log(e.message); }
              try { await github.rest.git.deleteRef({ owner, repo, ref: `tags/${r.tag_name}` }); } catch (e) { console.log(e.message); }
            }

      - name: Publish GitHub Release (timestamped)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: APK ${{ steps.tag.outputs.tag }} (v${{ steps.ver.outputs.vname }})
          body: |
            APK firmado generado automáticamente (build fresco, sin caché).
            versionName: `${{ steps.ver.outputs.vname }}`
            versionCode: `${{ steps.ver.outputs.vcode }}`
            SHA-256: `${{ steps.sha.outputs.sha }}`
            Run: `${{ github.run_id }}`
          files: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256
          generate_release_notes: false
          # IMPORTANTE: NO marcar como latest. El release "rolling latest"
          # más abajo es el único que debe quedar como latest, sino el QR
          # apunta a un asset viejo cuando GitHub mueve el puntero.
          make_latest: 'false'

      - name: Delete stale assets from rolling latest release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const latest = releases.find((r) => r.tag_name === 'latest');
            if (!latest) return;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: latest.id, per_page: 100,
            });
            for (const asset of assets) {
              console.log(`Deleting stale latest asset ${asset.name} (${asset.id})`);
              try {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              } catch (e) {
                console.log(e.message);
              }
            }

      - name: Move/refresh rolling `latest` release (always last build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: APK latest (v${{ steps.ver.outputs.vname }})
          body: |
            Último APK publicado. Se sobrescribe en cada build.
            versionName: `${{ steps.ver.outputs.vname }}`
            versionCode: `${{ steps.ver.outputs.vcode }}`
            SHA-256: `${{ steps.sha.outputs.sha }}`
            Run: `${{ github.run_id }}`
          files: |
            ${{ steps.locate.outputs.apk }}
            ${{ steps.locate.outputs.apk }}.sha256
          generate_release_notes: false
          make_latest: 'true'
